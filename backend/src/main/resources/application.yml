server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-mall-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:sk-your-deepseek-key}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 4096
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aimall.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

aimall:
  ai:
    openai:
      # OpenAI 兼容 Chat Completions 配置；建议通过环境变量覆盖，不要把密钥提交到仓库
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6}
      temperature: ${OPENAI_TEMPERATURE:0.3}
      max-tokens: ${OPENAI_MAX_TOKENS:4096}
    embedding:
      # OpenAI-compatible embeddings endpoint; empty key keeps offline fallback enabled.
      base-url: ${EMBEDDING_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
      api-key: ${EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
      model: ${EMBEDDING_MODEL:text-embedding-3-small}
  jwt:
    # 生产环境请修改为足够长的随机字符串
    secret: aimall-jwt-secret-key-please-change-in-production-2025
    expire-hours: 72
  upload:
    dir: ./uploads
    url-prefix: /uploads
  agent:
    max-steps: 8
    embedding-model: text-embedding-v1
    top-k: 5

logging:
  level:
    com.aimall: debug
